name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Daily, for the registry job below. It must fire precisely when NO release
  # run happened at all: two of three incidents in this class — an unpushed
  # lightweight tag and a dead provider — never create a workflow run, so
  # any check living inside the release path structurally can't see them.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Lint
        run: |
          pip install ruff --quiet
          ruff check . --select E,F,W --ignore E501

      # The nav-manifest mirror gate (spec §3.8). FRONTEND_REACT_LIBS[key]
      # ["nav"] is a hand-pinned copy of each pair's own nav-manifest.json,
      # and until this step existed the script that checks it was wired into
      # nothing: the mirror drifted five minors of auth-react without a word,
      # and every scaffolded project inherited the stale menu. It needs the
      # sibling stapel-react checkout, so it is fetched here and SIBLING_ROOT
      # points at the directory holding both — the same `${SIBLING_ROOT:-..}`
      # convention the generated gen:* invocations use. The script SKIPS with
      # exit 0 when that checkout is absent, so a fork without access to it
      # is not blocked; on this repo the checkout is always there, which is
      # what makes the gate real here.
      - name: Fetch the sibling stapel-react checkout
        uses: actions/checkout@v4
        with:
          repository: usestapel/stapel-react
          path: siblings/stapel-react

      - name: Nav-manifest mirror is in sync with the real pairs
        env:
          SIBLING_ROOT: ${{ github.workspace }}/siblings
        run: python scripts/check_nav_manifest_sync.py

      # The suite's dependencies are DECLARED (the `test` extra), not typed out
      # here. They used to be typed out here, which is how the list and the
      # suite drifted apart: three siblings were reached for by tests and named
      # nowhere, and their `importorskip`s therefore skipped on every CI run
      # this repo has ever had. `stapel-sibling-lint` is the gate over that
      # list, and it runs against this repo before the suite does.
      - name: Install test dependencies (the declared `test` extra)
        run: |
          pip install -e ".[test]" "psycopg[binary]" --quiet
          # ...and the four siblings the scaffold generates against are ALSO
          # taken from main, so a generator change meets the real fleet rather
          # than last week's release. The extra floors them; this pins them to
          # HEAD on top of it.
          #
          # stapel-chat joined the list with the gdpr fleet test that reaches
          # it: `config_manifest.lib_config_md` reads the INSTALLED
          # distribution's CONFIG.MD when there is no workspace checkout, and
          # the 0.7.3 wheel's copy carries the `settings` source token that
          # made `assemble_scaffold` raise. main has the correction; the wheel
          # will have it at the next chat release.
          pip install --quiet \
            "stapel-core @ git+https://github.com/usestapel/stapel-core.git" \
            "stapel-gdpr @ git+https://github.com/usestapel/stapel-gdpr.git" \
            "stapel-auth @ git+https://github.com/usestapel/stapel-auth.git" \
            "stapel-chat @ git+https://github.com/usestapel/stapel-chat.git"

      - name: The suite declares its own siblings (SIB001-006)
        run: python -m stapel_tools.sibling_lint .

      - name: Tests with coverage
        # Strict siblings: a DECLARED sibling that is missing FAILS instead of
        # skipping. A quiet skip here would mean the install step above did not
        # do what it says — the other half of the same defect class.
        env:
          STAPEL_TEST_STRICT_SIBLINGS: "1"
        run: |
          pytest tests/ \
            --cov=stapel_tools \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml \
            -o junit_family=legacy

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          files: coverage.xml
          flags: stapel-tools
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Smoke-generate every project type
        run: |
          pip install pyyaml --quiet
          python - <<'PY'
          import subprocess, sys, tempfile, yaml
          from pathlib import Path

          tmp = Path(tempfile.mkdtemp())
          cases = [
              ("mono", "monolith", None, None),
              ("mono-nats", "monolith", "nats", None),
              ("mono-tasknats", "monolith", None, "nats"),
              ("micro", "microservices", None, None),
              ("micro-kafka", "microservices", "kafka", None),
              ("micro-taskkafka", "microservices", None, "kafka"),
              ("mini", "minimal", None, None),
          ]
          sys.path.insert(0, ".")
          from stapel_tools.create_project import create_project
          for name, ptype, broker, task_broker in cases:
              create_project(name=name, project_type=ptype, title=name,
                             url="https://x.dev", company_name="X",
                             company_email="x@x.dev", modules=["core"],
                             output_dir=tmp, use_submodules=False,
                             init_git=False, broker=broker,
                             task_broker=task_broker)
              base = tmp / name / "docker-compose.base.yml"
              if base.exists():
                  yaml.safe_load(base.read_text())
              print("OK", name)
          PY

  # ─── A tag without a release is not a release ─────────────────────────────
  # The one wave step nobody had been watching. Three ways this stayed
  # silent, all of which actually happened: an unconfigured trusted
  # publisher (#48), a lightweight tag that `--follow-tags` doesn't push
  # (0.15.2/0.15.3), and a dead GitHub Actions setup (2026-08-06 — commits
  # and tags present, zero workflow runs). Found by hand every time.
  #
  # `fetch-depth: 0` is required: without tags there's nothing to check.
  # `continue-on-error` is deliberate: the fleet has historical gaps (~40 as
  # of 2026-08-07), and reddening every PR over them gets this gate turned
  # off. Watch the daily run instead.
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . --quiet
      - name: Every version tag has a PyPI release
        continue-on-error: true
        run: stapel-registry-check .

  # ─── E2E: "it drives" — the generated project must DRIVE, live, every run ──
  # (owner directive). Every live-run shishka is pinned here forever:
  # entrypoint model imports, kafka silence (inline bus default), a missing
  # proxy rule (generated prefixes), the port lost in redirects
  # (absolute_redirect off + $http_host). Release-gating: publish.yml runs
  # the same job before build.
  e2e-generated-project:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stapel
          POSTGRES_PASSWORD: stapel
          POSTGRES_DB: stapel_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stapel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tools + generated-project runtime deps
        run: |
          pip install -e . --quiet
          pip install pytest pytest-django "django<6.1" djangorestframework "psycopg[binary]" pyyaml \
            django-debug-toolbar debugpy celery redis django-redis \
            "stapel-core @ git+https://github.com/usestapel/stapel-core.git" \
            "stapel-auth @ git+https://github.com/usestapel/stapel-auth.git" \
            "stapel-notifications @ git+https://github.com/usestapel/stapel-notifications.git" \
            "stapel-gdpr @ git+https://github.com/usestapel/stapel-gdpr.git" --quiet

      - name: Generate (stapel-assemble, gates must be green)
        run: stapel-assemble e2e --type monolith --libs auth notifications --output-dir "$RUNNER_TEMP"

      # INFRASTRUCTURE MUST START, not merely "validate". Incident
      # (2026-08-07): compose carried `--max_payload` — nats-server has no
      # such flag, the server printed usage and exited, the container
      # restart-looped, and everything connecting got "Name or service not
      # known". `docker compose config -q` let this through: as a YAML
      # DOCUMENT it was flawless. A stand failure caught this, not CI.
      #
      # A SEPARATE project is generated for this: the e2e project above has
      # no broker (`stapel-assemble` doesn't select one for it), so there
      # would be nothing to check there — a silent skip instead of a gate.
      - name: Generated project's infra ACTUALLY comes up (nats)
        run: |
          python - <<'PY'
          from pathlib import Path
          from stapel_tools.create_project import create_project
          create_project(name="natse2e", project_type="monolith", title="natse2e",
                         url="https://x.dev", company_name="X", company_email="x@x.dev",
                         modules=["core"], output_dir=Path("/tmp/natse2e"),
                         use_submodules=False, init_git=False, broker="nats")
          PY
          cd /tmp/natse2e/natse2e
          docker compose -f docker-compose.local.yml --env-file .env.local up -d nats
          sleep 5
          cid=$(docker compose -f docker-compose.local.yml --env-file .env.local ps -q nats)
          state=$(docker inspect -f '{{.State.Status}}' "$cid")
          restarts=$(docker inspect -f '{{.RestartCount}}' "$cid")
          echo "nats: state=$state restarts=$restarts"
          docker logs "$cid" | tail -20
          # A wrong flag kills the process immediately; restart:unless-stopped
          # brings it back up, and the restart count is the most honest signal.
          [ "$state" = "running" ] && [ "$restarts" = "0" ]
          # ...and the setting this was all for ACTUALLY took effect — ask
          # the server itself, not our own config.
          docker exec "$cid" wget -qO- http://localhost:8222/varz | tr ',' '\n' | grep max_payload | tee /dev/stderr | grep -q 8388608
          docker compose -f docker-compose.local.yml --env-file .env.local down -v

      - name: stapel-verify on the generated project (0 required)
        run: stapel-verify "$RUNNER_TEMP/e2e"

      - name: Live circle — migrate, register, OTP from the LOG, verify, login
        working-directory: ${{ runner.temp }}/e2e/svc-e2e
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: stapel
          POSTGRES_PASSWORD: stapel
          POSTGRES_DB: stapel_e2e
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python "$GITHUB_WORKSPACE/scripts/e2e_live_circle.py" e2e

      # The 0.55.5 run died two steps below on an ERESOLVE while every pin was
      # published and resolvable — the pair pins had been raised to the
      # 2026-08 release and the SUBSTRATE under them had not
      # (@stapel/core 0.17.0 against a peer floor of >=0.18.1). The gate below
      # asks the registry for each pinned @stapel/* package's own
      # peerDependencies and fails when the scaffold's pin of that peer does
      # not satisfy it. It checks the WHOLE pin table, not just the two pairs
      # this e2e generates, and the daily schedule fires this job with no push
      # — which is the only way drift that arrives from ANOTHER repo (a pair
      # raising its floor) ever gets noticed here.
      - name: The scaffold's pins satisfy every pair's peer ranges
        run: python "$GITHUB_WORKSPACE/scripts/check_npm_peer_graph.py"

      # The 0.54.0 publish died right here on `No matching version found for
      # @stapel/auth-react@^0.16.1`: the scaffold's version mirror is copied
      # from the sibling stapel-react checkout, which had 0.16.1 in its tree
      # with the publish still pending — and npm, the only registry this
      # install consults, had 0.16.0. So the pins are resolved against the
      # registry first: a range that resolves is kept (the mirror IS the pin),
      # a range that resolves to nothing falls back to the newest published
      # version, and every fallback is LISTED by name so "the pair has not
      # shipped yet" is a line in the log instead of a surprise for the next
      # person who generates a project.
      - name: Pin the generated frontend to versions that exist on npm
        working-directory: ${{ runner.temp }}/e2e/frontend
        run: python "$GITHUB_WORKSPACE/scripts/e2e_npm_pins.py" package.json

      - name: Frontend builds (npm install + vite build; npm ci needs a lockfile the scaffold doesn't ship yet)
        working-directory: ${{ runner.temp }}/e2e/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Compose validity + live nginx circuit (redirect-port regression)
        working-directory: ${{ runner.temp }}/e2e
        run: |
          docker compose -f docker-compose.local.yml --env-file .env.local config -q
          docker compose --env-file .env config -q
          # Lightest live circuit: nginx (+ its only dependency, the Vite
          # container). Proves the envsubst template renders, nginx STARTS
          # without the backend (deferred upstream resolution), and the
          # owner-canon redirect: /e2e (no slash) -> 301 with a RELATIVE
          # Location (absolute_redirect off + $http_host — the ":8080 loses
          # the port" regression, permanently).
          docker compose -f docker-compose.local.yml --env-file .env.local up -d nginx
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://localhost:8080/e2e && break
            sleep 1
          done
          response=$(curl -sI http://localhost:8080/e2e | tr -d '\r')
          echo "$response"
          echo "$response" | grep -q "^HTTP/1.1 301"
          echo "$response" | grep -q "^Location: /e2e/$"
          # Owner postmortem ("/calendar page vs backend" collision): a
          # generated lib reservation must NEVER swallow the module's BARE
          # root — that's the frontend router's page space. /auth is the
          # stand-in module here (already installed on this project; no
          # extra pip dep to add just for this nginx-only check). Wait for
          # the frontend's real upstream (Vite, nginx's only dependency) to
          # actually be ready — unlike the /e2e redirect above (answered by
          # nginx itself, pre-upstream), a 200 here proves the catch-all
          # served it.
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth)
            [ "$code" = "200" ] && break
            sleep 1
          done
          bare_response=$(curl -sI http://localhost:8080/auth | tr -d '\r')
          echo "$bare_response"
          echo "$bare_response" | grep -q "^HTTP/1.1 200"
          if echo "$bare_response" | grep -q "^Location: /auth/$"; then
            echo "REGRESSION: /auth (bare module root) redirected into the backend reservation — it must stay the frontend's"
            exit 1
          fi
          # ...and the module's reserved API sub-path still resolves into the
          # backend reservation: svc-e2e is NOT running in this nginx-only
          # circuit, so a 502 from nginx's own failed upstream attempt PROVES
          # routing went there — the frontend catch-all would otherwise
          # happily 200 an unknown SPA route instead.
          api_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/auth/api/v1/x)
          echo "auth/api/v1/x -> $api_code"
          [ "$api_code" = "502" ]
          docker compose -f docker-compose.local.yml --env-file .env.local down -v
