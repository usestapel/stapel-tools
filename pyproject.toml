[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stapel-tools"
version = "0.60.0"
description = "CLI scaffold and linting tools for Stapel/Django microservices"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = []

# What the TEST SUITE needs, as opposed to what the package needs — the
# declaration `stapel-sibling-lint` was written to enforce, applied first to
# the repo that ships it. Before 0.55.0 this list did not exist, and the suite
# imported six siblings on the strength of a shared development virtualenv
# having them: stapel_core (tests/test_codegen.py, both as an import and as an
# INSTALLED_APPS label), stapel_auth/stapel_gdpr (the generated-project gates),
# and stapel_profiles/stapel_calendar/stapel_cdn behind three `importorskip`s
# that had therefore never run on a runner. CI installs `.[test]`, so the list
# is the thing that decides what CI has, and the strict flag on the pytest step
# turns a missing one from a quiet skip into a failure.
[project.optional-dependencies]
test = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "pyyaml",
    "django<6.1",
    "djangorestframework",
    "drf-spectacular",
    "stapel-core>=0.45.0,<1",
    # The catalog_import suite validates its emitted `group` fixtures against the
    # live engine — a fixture is only worth anything if the library that will
    # load it accepts it, and that is not a claim a self-test can make.
    "stapel-attributes>=0.6.0,<1",
    # These two are reached by a SUBPROCESS, not an import: the generator
    # tests boot a generated project's Django and resolve its URLs, and that
    # interpreter imports the libs the project selected. No AST here can see
    # that, hence the suppression and this reason.
    "stapel-auth>=0.28.0,<1",   # noqa: SIB005 - imported by the generated project under test
    "stapel-gdpr>=0.5.0,<1",    # noqa: SIB005 - imported by the generated project under test
    "stapel-profiles>=0.16.0,<1",
    # The gdpr derivation's fleet test covers BOTH participation shapes, and
    # chat is the only in-process `GDPRProvider` in the selection. Undeclared,
    # its four tests skipped on every runner — a bare `skipif` that
    # STAPEL_TEST_STRICT_SIBLINGS cannot see — while a `settings` source token
    # in chat's own CONFIG.MD made `assemble_scaffold` raise for that same
    # selection in a published release.
    "stapel-chat>=0.7.3,<1",
    "stapel-calendar>=0.6.0,<1",
    "stapel-cdn>=0.17.0,<1",
    # Reached as DATA, not as an import: the billing env-hatch tests read
    # stapel-billing's own `docs/capabilities.json` (the PAYMENT_PROVIDER axis
    # default, and the axis surface a STRIPE_SECRET_KEY is refused against).
    # `_module_config.capabilities_doc` finds it in the workspace checkout OR
    # in the installed distribution — 0.11.0's wheel ships
    # `stapel_billing/docs/capabilities.json`, so declaring it here is what
    # gives the runner the second path. Undeclared, both tests reddened 0.55.5.
    "stapel-billing>=0.11.0,<1",
    # stapel-cdn's `images` submodule is ON in a generated project, and its
    # check stapel_cdn.images.E001 FAILS `manage.py check` without libvips —
    # so a generated project carrying cdn does not boot on a machine that has
    # no image decoder. Every developer's laptop has one, which is why nobody
    # saw it until the strict-siblings flag made the URL-resolution test
    # actually RUN on a runner. `[binary]` pulls the manylinux/macOS wheels
    # that bundle libvips, so this needs no apt step.
    "pyvips[binary]",
]

[project.scripts]
stapel-lint = "stapel_tools.lint:main"
stapel-migration-lint = "stapel_tools.migration_lint:main"
stapel-adoption-lint = "stapel_tools.adoption_lint:main"
stapel-config-lint = "stapel_tools.config_lint:main"
stapel-config-manifest = "stapel_tools.config_manifest:main"
stapel-url-lint = "stapel_tools.url_lint:main"
stapel-api-lint = "stapel_tools.api_lint:main"
stapel-authz-lint = "stapel_tools.authz_lint:main"
stapel-sibling-lint = "stapel_tools.sibling_lint:main"
stapel-nginx-cache-lint = "stapel_tools.nginx_cache_lint:main"
stapel-env-address-lint = "stapel_tools.env_address_lint:main"
stapel-exposure-lint = "stapel_tools.exposure_lint:main"
stapel-frontend-delivery-lint = "stapel_tools.frontend_delivery_lint:main"
stapel-swap-lint = "stapel_tools.swap_lint:main"
stapel-shell-python-lint = "stapel_tools.shell_python_lint:main"
stapel-doc-lint = "stapel_tools.doc_lint:main"
stapel-po-lint = "stapel_tools.po_lint:main"
stapel-po-prune = "stapel_tools.po_prune:main"
stapel-makemessages = "stapel_tools.makemessages:main"
stapel-surface-lint = "stapel_tools.surface_lint:main"
stapel-index-lint = "stapel_tools.index_lint:main"
stapel-registry-check = "stapel_tools.registry_check:main"
stapel-verify = "stapel_tools.verify:main"
stapel-release-manifest = "stapel_tools.release:main"
stapel-new-service = "stapel_tools.new_service:main"
stapel-new-module = "stapel_tools.new_module:main"
stapel-new-library = "stapel_tools.new_library:main"
stapel-new-react-lib = "stapel_tools.new_react_lib:main"
stapel-remove-service = "stapel_tools.remove_service:main"
stapel-create-project = "stapel_tools.create_project:main"
stapel-frontend-repo-init = "stapel_tools.frontend_repo_init:main"
stapel-assemble = "stapel_tools.assemble_scaffold:main"
stapel-codegen = "stapel_tools.codegen:main"
stapel-analytics-report = "stapel_tools.analytics_report:main"
stapel-i18n-seed = "stapel_tools.i18n_seed:main"
stapel-reserved-paths = "stapel_tools.reserved_paths:main"
stapel-catalog = "stapel_tools.catalog:main"
stapel-surface = "stapel_tools.surface:main"
stapel-llms-txt = "stapel_tools.llms_txt:main"
stapel-gen-client = "stapel_tools.gen_client:main"
stapel-docs = "stapel_tools.api_docs:main"
stapel-readme = "stapel_tools.readme:main"
stapel-storefront = "stapel_tools.storefront:main"
stapel-disk = "stapel_tools.disk_guard:main"
stapel-catalog-import = "stapel_tools.catalog_import.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["stapel_tools*"]

# The importer reads two data files at run time — the show_at_title source table
# and the vocabulary-fixture schema it validates its own output against — so the
# wheel has to carry them, not just the .py files.
[tool.setuptools.package-data]
"stapel_tools.catalog_import" = ["flags_default.json", "schemas/*.json"]

[tool.pytest.ini_options]
# tests/fixtures holds INPUT trees — repositories-in-miniature the linters are
# run AGAINST. Their `test_*.py` files are data: importing them here would
# collect stapel-chat's suite into this one. (The default list is repeated
# because setting this key replaces it.)
norecursedirs = ["fixtures", "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}"]
markers = [
    # The integration gate in tests/test_public_surface.py: it installs a real
    # npm tree and runs tsc/vite/eslint over the generated container. Opt-in
    # via STAPEL_SLOW_TESTS=1 (it needs network and minutes), selectable with
    # `-m slow`.
    "slow: needs network and minutes; opt in with STAPEL_SLOW_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A verbatim port of tasks/catalog-scraping/tools/map_to_stapel.py, whose measured
# 99.88 % parse rate is the reason it exists. Reformatting it would break the
# only property that makes the copy trustworthy: that it is byte-comparable to
# the original. E702 is the original's `out.append(x); i += 1` style.
"stapel_tools/catalog_import/dependency_parser.py" = ["E702"]
